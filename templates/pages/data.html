{% extends "base.html" %}
{% block content %}
<div class="panel"><div class="panel-b" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px" id="dx-filters">
  <div class="field"><label>Country</label><select class="inp" id="f-country"><option value="IN">India</option><option value="AL">All BRICS</option></select></div>
  <div class="field"><label>City</label><select class="inp" id="f-city"><option value="">All cities</option></select></div>
  <div class="field"><label>Date range</label><select class="inp" id="f-days"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></div>
  <div class="field"><label>Pollutant</label><select class="inp" id="f-pollutant"><option value="aqi">AQI</option><option value="pm25">PM2.5</option><option value="pm10">PM10</option></select></div>
  <div class="field"><label>Source</label><select class="inp" id="f-source"><option value="">Any</option><option>Industrial</option><option>Agricultural</option><option>Vehicular</option><option>Waste</option><option>Biomass</option><option>Dust</option></select></div>
  <div class="field"><label>Min confidence</label><select class="inp" id="f-conf"><option value="0">Any</option><option value="80">80%+</option><option value="90">90%+</option></select></div>
  <div class="field"><label>Event type</label><select class="inp" id="f-event"><option value="">Any</option><option>CRITICAL</option><option>HIGH</option><option>MODERATE</option></select></div>
</div></div>
<div style="display:flex;gap:8px;align-items:center"><span class="badge-src demo">DEMO DATA</span><span class="dim mono" style="font-size:11px" id="dx-storage"></span></div>
<div class="grid g2">
  <div class="panel"><div class="panel-h"><h3 id="dx-trend-title">AQI Trends</h3></div><div class="panel-b"><div class="chart-box"><canvas id="dx-trend"></canvas></div></div></div>
  <div class="panel"><div class="panel-h"><h3>Fire Events (satellite-derived, demo)</h3></div><div class="panel-b"><div class="chart-box"><canvas id="dx-fires"></canvas></div></div></div>
  <div class="panel"><div class="panel-h"><h3>Citizen Reports / day</h3></div><div class="panel-b"><div class="chart-box"><canvas id="dx-reports"></canvas></div></div></div>
  <div class="panel"><div class="panel-h"><h3>Weather Correlation · Wind vs AQI</h3></div><div class="panel-b"><div class="chart-box"><canvas id="dx-scatter"></canvas></div></div></div>
</div>
<div class="panel"><div class="panel-h"><h3>Pollution Events</h3><span class="dim mono" style="font-size:11px" id="dx-count"></span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th>Region</th><th>Country</th><th class="num">AQI</th><th class="num">PM2.5</th><th>Source category</th><th>Status</th><th>Confidence</th></tr></thead><tbody id="dx-rows"></tbody></table></div></div>
{% endblock %}
